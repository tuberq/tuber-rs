name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Cheap gate in front of the four-target matrix, so a mistake costs seconds
  # rather than the two minutes a full build takes before failing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version in the binary comes from env!("CARGO_PKG_VERSION"), resolved
      # at compile time — so a tag pushed without bumping Cargo.toml ships a
      # release named v0.14.0 whose binaries report v0.13.0, and says nothing
      # about it. This is the one failure mode of keeping Cargo.toml as the
      # source of truth, and it is worth a check rather than an automation:
      # patching Cargo.toml from the tag instead would leave the committed
      # version permanently stale, so building the same commit from source would
      # report something different from the release.
      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches Cargo.toml"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Repeated from ci.yml on purpose: a release should verify the commit it is
      # actually building rather than trust that a branch run covered it.
      - run: cargo test --workspace

      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tuber-tui-${{ matrix.target }}.tar.gz tuber-tui
          tar czf ../../../tuber-cli-${{ matrix.target }}.tar.gz tuber-cli
          cd ../../..
          sha256sum tuber-tui-${{ matrix.target }}.tar.gz > tuber-tui-${{ matrix.target }}.tar.gz.sha256
          sha256sum tuber-cli-${{ matrix.target }}.tar.gz > tuber-cli-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: tuber-${{ matrix.target }}
          path: |
            tuber-tui-${{ matrix.target }}.tar.gz
            tuber-tui-${{ matrix.target }}.tar.gz.sha256
            tuber-cli-${{ matrix.target }}.tar.gz
            tuber-cli-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v6
        with:
          pattern: tuber-*
          merge-multiple: true

      # fetch-tags on checkout is not enough, which cost v0.14.1 its release.
      # Checkout resolves a tag push to its commit SHA and writes
      # refs/tags/<name> pointing straight at that commit, so the ref exists
      # before any tag fetch runs — and fetch will not clobber an existing ref.
      # Every *other* tag arrives as its real object and this one, the only one
      # we need, stays lightweight. An explicit refspec with --force replaces
      # it; `t [tag update]` in the log is the fix doing its job.
      - name: Fetch the tag object itself
        if: startsWith(github.ref, 'refs/tags/')
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # generate_release_notes builds its summary from merged pull requests, and
      # this repository commits straight to main — so it had nothing to
      # summarise and every release read as a bare compare link, while the tag
      # annotation holding the actual notes never reached the page.
      - name: Read the tag's annotation
        id: notes
        run: |
          # Assert what we depend on rather than trusting it. Reading a
          # lightweight tag yields the commit message, which looks like notes and
          # is not, so silence here is worse than failure.
          kind=$(git cat-file -t "$GITHUB_REF_NAME")
          if [ "$kind" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a $kind, not an annotated tag — no notes to publish"
            exit 1
          fi
          {
            echo 'body<<TAG_BODY_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo TAG_BODY_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          # Still appended, for the commit list and the compare link.
          generate_release_notes: true
          files: |
            tuber-*-*.tar.gz
            tuber-*-*.tar.gz.sha256

  docker:
    # Gated too, so a failing test cannot publish an image tagged `latest`.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from Cargo.toml
        id: cargo_version
        run: echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.cargo_version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
